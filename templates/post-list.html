<ul class="list">
  {% for post in blog.pages %}
  <li>
    <a href="{{ post.permalink }}">{{ post.title }}</a>
    {% if post.draft %}<span class="draft">draft</span>{% endif %}
    <time class="meta" datetime="{{ post.date }}">{{ post.date | date(format="%b %-d, %Y") }}</time>
  </li>
  {% endfor %}
</ul>
